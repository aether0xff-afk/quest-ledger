name: visual-smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox xdotool imagemagick \
            mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Launch Minecraft 26.2 and capture Quest Ledger
        env:
          QUEST_LEDGER_VISUAL_SMOKE_TEST: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          set -euo pipefail
          mkdir -p run visual-output
          cat > run/options.txt <<'EOF'
          lang:ko_kr
          fullscreen:false
          guiScale:2
          EOF

          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset \
            >visual-output/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          openbox >visual-output/openbox.log 2>&1 &

          gradle runClient --no-daemon --stacktrace \
            >visual-output/client.log 2>&1 &
          GAME_PID=$!

          wait_for_marker() {
            local marker="$1"
            for _ in $(seq 1 240); do
              [ -f "$marker" ] && return 0
              [ -f "run/$marker" ] && return 0
              if ! kill -0 "$GAME_PID" 2>/dev/null; then
                echo 'Minecraft exited before the UI marker appeared.'
                tail -n 200 visual-output/client.log || true
                exit 1
              fi
              sleep 1
            done
            echo "Timed out waiting for $marker"
            tail -n 200 visual-output/client.log || true
            exit 1
          }

          capture_with_f2() {
            local marker="$1"
            local output="$2"
            wait_for_marker "$marker"

            mkdir -p run/screenshots
            local before
            before=$(find run/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)
            echo "Active window before F2:"
            xdotool getactivewindow getwindowname || true
            xdotool key --clearmodifiers F2

            local source=''
            for _ in $(seq 1 60); do
              local after
              after=$(find run/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)
              if [ "$after" -gt "$before" ]; then
                source=$(find run/screenshots -maxdepth 1 -type f -name '*.png' \
                  -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
                break
              fi
              sleep 1
            done

            if [ -z "$source" ]; then
              echo "F2 did not create a screenshot for $marker."
              xdotool search --onlyvisible --name '.*' getwindowname %@ || true
              tail -n 200 visual-output/client.log || true
              exit 1
            fi

            cp "$source" "visual-output/$output"
            identify "visual-output/$output"
            local mean
            mean=$(convert "visual-output/$output" -colorspace gray -format '%[fx:mean]' info:)
            echo "$output grayscale mean: $mean"
            awk -v mean="$mean" 'BEGIN { if (mean < 0.01) exit 1 }'
          }

          capture_with_f2 quest-ledger-builder-ready quest-ledger-builder.png
          capture_with_f2 quest-ledger-types-ready quest-ledger-types.png

          wait "$GAME_PID" || {
            tail -n 200 visual-output/client.log || true
            exit 1
          }
      - name: Upload real Minecraft screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-ledger-visual-smoke
          path: visual-output/
