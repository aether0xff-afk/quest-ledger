name: apply-client-store-audit-patch

on:
  push:
    branches:
      - audit/full-function-v0.4.3

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply scoped store audit fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-function-v0.4.3
          fetch-depth: 0

      - name: Apply patch and remove temporary patch machinery
        run: |
          python tools/apply_client_store_audit_patch.py
          rm tools/apply_client_store_audit_patch.py
          rm .github/workflows/apply-client-store-audit-patch.yml

      - name: Commit patch
        run: |
          git config user.name 'quest-ledger-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply scoped store audit fixes'
          git push origin HEAD:audit/full-function-v0.4.3
